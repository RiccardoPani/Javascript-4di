
<!DOCTYPE html>
<html>
<head>
    <title>Calcolatrice</title>
</head>
<body>

    <h2>Calcolatrice</h2>

    <input type="number" id="n1" placeholder="Primo numero">

    <select id="operazione">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input type="number" id="n2" placeholder="Secondo numero">

    <button onclick="calcola()">Calcola</button>

    <p id="risultato"></p>

    <script>
        function calcola() {
            let a = Number(document.getElementById("n1").value);
            let b = Number(document.getElementById("n2").value);
            let op = document.getElementById("operazione").value;
            let r;

            if (op == "+") r = a + b;
            if (op == "-") r = a - b;
            if (op == "*") r = a * b;
            if (op == "/") r = a / b;

            document.getElementById("risultato").innerHTML = "Risultato: " + r;
        }
    </script>

</body>
</html>
